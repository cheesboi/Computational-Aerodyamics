name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # XFOIL 6.99 is packaged in Ubuntu universe, so no Fortran build step.
      - name: Install XFOIL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xfoil

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # These tests need XFOIL but NOT the UIUC wind tunnel data, which is not
      # redistributed here. They check the screening logic that keeps
      # non-converged solutions out of the published results.
      - name: Run tests
        run: pytest -v
